/* ═══ DYNAMIC PARSER — N periods, column mapping via Rekapitulace match ═══ */
function parseXlsx(wb){
  const rk=wb.Sheets["Rekapitulace stavby"];if(!rk)return null;
  // 1. find all period headers (row 92 = 0-idx 91), cols 50-150
  const periods=[];
  for(let c=49;c<150;c++){const v=gs(rk,91,c);if(v.includes("Prostavěnost"))periods.push({label:v.replace("Prostavěnost ",""),valCol:c+1});}
  if(!periods.length)return null;
  const NP=periods.length;
  // 2. per-object + totals
  const objMap={"00":"VRN","03":"03-Int","04":"04-Ext"};
  const byObj={};let budget=0;
  for(let ri=94;ri<=100;ri++){const code=gs(rk,ri,3);const lb=objMap[code];if(!lb)continue;
    const b=gn(rk,ri,32);budget+=b;
    byObj[lb]={budget:Math.round(b),p:periods.map(pc=>Math.round(gn(rk,ri,pc.valCol)))};}
  const totP=periods.map(pc=>Math.round(gn(rk,103,pc.valCol)));
  const cum=totP.reduce((a,b)=>a+b,0);
  const auth={budget:Math.round(budget),periods:periods.map(p=>p.label),totP,cum,byObj};
  // 3. detail sheets
  const cfgs=[];
  wb.SheetNames.forEach(n=>{if(n.startsWith("00"))cfgs.push({name:n,label:"VRN"});else if(n.startsWith("03"))cfgs.push({name:n,label:"03-Int"});else if(n.startsWith("04"))cfgs.push({name:n,label:"04-Ext"});});
  if(!cfgs.length)return null;
  const items=[];
  cfgs.forEach(cfg=>{
    const ws=wb.Sheets[cfg.name];if(!ws||!ws["!ref"])return;
    const sumR=XLSX.utils.decode_range(ws["!ref"]).e.r;
    const obj=auth.byObj[cfg.label];if(!obj)return;
    // map columns: match SUM row value to rekap per-object
    const colFor=new Array(NP).fill(null);const used=new Set();
    for(let c=19;c<56;c++){const v=gn(ws,sumR,c);if(Math.abs(v)>1){for(let pi=0;pi<NP;pi++){if(colFor[pi]===null&&Math.abs(v-obj.p[pi])<2){colFor[pi]=c;used.add(c);break;}}}}
    // fallback: rekap value != 0, no SUM col → scan items
    const lastMapped=Math.max(19,...colFor.filter(c=>c!==null));
    for(let pi=0;pi<NP;pi++){
      if(colFor[pi]===null&&obj.p[pi]!==0){
        let best=null,bestCnt=0;
        for(let c=lastMapped+1;c<56;c++){
          if(used.has(c))continue;
          let cnt=0,s=0;
          for(let r=9;r<sumR;r++){const v=gn(ws,r,c);if(Math.abs(v)>100){cnt++;s+=v;}}
          if(cnt>=5&&s>obj.p[pi]*0.3&&cnt>bestCnt){best=c;bestCnt=cnt;}
        }
        if(best!==null){colFor[pi]=best;used.add(best);}
      }
    }
    // extract K+M+VV
    let ck=null;
    const push=it=>{if(it&&(it.p.some(v=>v)||it.b>0))items.push(it);};
    for(let r=9;r<sumR;r++){
      const typ=gs(ws,r,3),desc=gs(ws,r,5).slice(0,80),bv=gn(ws,r,9);
      const pv=colFor.map(c=>c!==null?Math.round(gn(ws,r,c)*100)/100:0);
      if(typ==="K"){push(ck);ck={s:cfg.label,d:desc,b:Math.round(bv*100)/100,p:pv};}
      else if((typ==="M"||typ==="VV")&&ck){ck.b=Math.round((ck.b+bv)*100)/100;ck.p=ck.p.map((a,i)=>Math.round((a+pv[i])*100)/100);}
      else if(pv.some(v=>v)){push(ck);ck=null;let note="";[24,28,34,38,40,5,4].forEach(nc=>{if(!note){const nv=gs(ws,r,nc);if(nv&&!nv.startsWith("="))note=nv.slice(0,80);}});items.push({s:cfg.label,d:note||("Ř."+(r+1)),b:0,p:pv});}
    }
    push(ck);
  });
  items.forEach(it=>{const c2=it.p.reduce((a,b)=>a+b,0);
    if(it.b===0){it.st=c2>0?"manual":c2<0?"meneprace":"zero";}
    else{const pct=c2/it.b*100;if(it.p.slice(1).some(v=>v<0))it.st="meneprace";else if(pct>100)it.st="viceprace";else if(pct>=99)it.st="done";else if(pct>0)it.st="partial";else it.st="zero";}});
  return{items,auth};
}

function calcDiff(o,n){const ch=[],om={};o.forEach(i=>{const k=itemKey(i);if(!om[k])om[k]=[];om[k].push(i);});n.forEach(ni=>{const k=itemKey(ni);const nc=icum(ni);if(om[k]&&om[k].length>0){const oi=om[k].shift();const oc=icum(oi);if(Math.abs(oc-nc)>1)ch.push({type:"changed",item:ni,old:oi,diffCum:nc-oc});}else ch.push({type:"new",item:ni,diffCum:nc});});Object.values(om).forEach(arr=>arr.forEach(oi=>{const oc=icum(oi);if(oc>0)ch.push({type:"removed",item:oi,diffCum:-oc});}));return ch.sort((a,b)=>Math.abs(b.diffCum)-Math.abs(a.diffCum));}

          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12,marginBottom:20}}>
            {a.periods.map((l,i)=>(<div key={i} style={{background:C.card,borderRadius:12,border:"1px solid "+C.brd,padding:"16px 22px",borderLeft:"4px solid "+PC[i%PC.length]}}><div style={{fontSize:13,color:C.mut,fontWeight:600}}>P{i+1} · {l}</div><div style={{fontSize:24,fontWeight:700,fontFamily:mono,color:PC[i%PC.length],marginTop:4,whiteSpace:"nowrap"}}>{fmtK(a.totP[i])} Kč</div></div>))}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(380px,1fr))",gap:14,marginBottom:20}}>
            <div style={{background:C.card,borderRadius:12,border:"1px solid "+C.brd,padding:20}}><div style={{fontSize:16,fontWeight:600,marginBottom:14}}>Prostavěnost dle objektů</div><ResponsiveContainer width="100%" height={240}><BarChart data={barData} layout="vertical"><XAxis type="number" tickFormatter={fmtK} tick={{fill:C.mut,fontSize:13}}/><YAxis type="category" dataKey="name" width={55} tick={{fill:C.txt,fontSize:14,fontWeight:600}}/><Tooltip {...ttip} formatter={v=>[fmt(v)+" Kč"]}/><Bar dataKey="budget" name="Rozpočet" fill="#1e293b" radius={[0,4,4,0]}/><Bar dataKey="done" name="Prostavěno" radius={[0,4,4,0]}>{barData.map((d,i)=><Cell key={i} fill={OC[d.name]||"#60a5fa"}/>)}</Bar></BarChart></ResponsiveContainer></div>
            <div style={{background:C.card,borderRadius:12,border:"1px solid "+C.brd,padding:20}}><div style={{fontSize:16,fontWeight:600,marginBottom:14}}>Stavové rozložení</div><ResponsiveContainer width="100%" height={240}><PieChart><Pie data={pieData} cx="50%" cy="50%" innerRadius={55} outerRadius={95} paddingAngle={2} dataKey="value">{pieData.map((d,i)=><Cell key={i} fill={d.fill}/>)}</Pie><Tooltip {...ttip}/><Legend wrapperStyle={{fontSize:13}}/></PieChart></ResponsiveContainer></div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:12}}>
            {Object.entries(a.byObj).map(([k,v])=>{const cum2=v.p.reduce((x,y)=>x+y,0);const op=v.budget>0?cum2/v.budget*100:0;return(<div key={k} style={{background:C.card,borderRadius:12,border:"1px solid "+C.brd,padding:"18px 22px",borderLeft:"4px solid "+(OC[k]||"#666")}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><span style={{fontWeight:700,fontSize:18}}>{k}</span><span style={{fontFamily:mono,fontWeight:700,fontSize:18,color:OC[k]}}>{op.toFixed(1)}%</span></div><div style={{background:C.brd,borderRadius:4,height:8,overflow:"hidden",marginBottom:8}}><div style={{width:Math.min(100,op)+"%",height:"100%",borderRadius:4,background:"linear-gradient(90deg,#3b82f6,#10b981)"}}/></div><div style={{fontSize:14,color:C.mut}}>Rozpočet: {fmtK(v.budget)} Kč · Prostavěno: {fmtK(cum2)} Kč</div><div style={{fontSize:12,color:C.mut,marginTop:4}}>{a.periods.map((l,i2)=>"P"+(i2+1)+": "+fmtK(v.p[i2])).join(" · ")}</div></div>);})}
          </div>
        </div>)}

        {tab==="table"&&(<div>
          <div style={{display:"flex",gap:16,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
              <span style={{fontSize:13,color:C.mut,fontWeight:600}}>STAV</span>
              {[["all","Vše"],["done","Hotovo"],["partial","Rozprac."],["viceprace","Vícepráce"],["meneprace","Méněpráce"],["manual","Ruční"]].map(([k,l])=>(<button key={k} onClick={()=>setFSt(k)} style={{padding:"6px 14px",borderRadius:8,border:fSt===k?"1px solid "+C.acc:"1px solid "+C.brd,background:fSt===k?C.acc+"22":C.card,color:fSt===k?C.acc:C.mut,cursor:"pointer",fontSize:13,fontWeight:600}}>{l}</button>))}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{fontSize:13,color:C.mut,fontWeight:600}}>OBJEKT</span>
              {[["all","Vše"],["VRN","VRN"],["03-Int","O3"],["04-Ext","O4"]].map(([k,l])=>(<button key={k} onClick={()=>setFObj(k)} style={{padding:"6px 14px",borderRadius:8,border:fObj===k?"1px solid "+C.acc:"1px solid "+C.brd,background:fObj===k?C.acc+"22":C.card,color:fObj===k?C.acc:C.mut,cursor:"pointer",fontSize:13,fontWeight:600}}>{l}</button>))}
            </div>
            <input type="text" placeholder="Hledat položku..." value={q} onChange={e=>setQ(e.target.value)} style={{padding:"8px 14px",borderRadius:8,border:"1px solid "+C.brd,background:C.card,color:C.txt,fontSize:14,outline:"none",width:200}}/>
            <span style={{fontSize:13,color:C.mut}}>{fS.n} / {items.length} položek</span>
          </div>
          <div style={{overflowX:"auto",background:C.card,borderRadius:12,border:"1px solid "+C.brd}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:14}}>
              <thead><tr style={{background:"#0a0f1d"}}>
                {[["s","OBJ.",50],["d","POLOŽKA",null],["b","ROZPOČET",95]].map(([k,l,w])=>(<th key={k} onClick={()=>toggle(k)} style={{padding:"10px 8px",textAlign:k==="d"?"left":"right",width:w||undefined,cursor:"pointer",userSelect:"none",borderBottom:"2px solid "+C.brd,fontWeight:700,color:C.mut,fontSize:11,letterSpacing:".05em"}}>{l} {sortK===k?(sortD==="asc"?"▲":"▼"):""}</th>))}
                {a.periods.map((l,pi)=>(<th key={"p"+pi} onClick={()=>toggle("p_"+pi)} title={l} style={{padding:"10px 8px",textAlign:"right",width:80,cursor:"pointer",userSelect:"none",borderBottom:"2px solid "+C.brd,fontWeight:700,color:PC[pi%PC.length],fontSize:11,letterSpacing:".05em"}}>P{pi+1} {sortK==="p_"+pi?(sortD==="asc"?"▲":"▼"):""}</th>))}
                {[["cum","CELKEM",95],["rem","ZBÝVÁ",80],["pct","%",55],["st","STAV",100]].map(([k,l,w])=>(<th key={k} onClick={()=>toggle(k)} style={{padding:"10px 8px",textAlign:"right",width:w,cursor:"pointer",userSelect:"none",borderBottom:"2px solid "+C.brd,fontWeight:700,color:C.mut,fontSize:11,letterSpacing:".05em"}}>{l} {sortK===k?(sortD==="asc"?"▲":"▼"):""}</th>))}
                <th style={{padding:"10px 8px",width:120,borderBottom:"2px solid "+C.brd,fontWeight:700,color:C.mut,fontSize:11,letterSpacing:".05em"}}>POSTUP</th>
              </tr></thead>
              <tbody>{filtered.map((it,i)=>{const cum2=icum(it);const rem=it.b>0?it.b-cum2:0;const pv=it.b>0?cum2/it.b*100:0;const pvStr=it.b>0?pv.toFixed(0):"–";const barColor=pv>100?"#f87171":pv>=99?"#34d399":pv>0?"#60a5fa":"#1e293b";return(<tr key={i} style={{borderBottom:"1px solid "+C.brd}}>
                <td style={{padding:"8px",textAlign:"center"}}><span style={{background:(OC[it.s]||"#666")+"22",color:OC[it.s],padding:"3px 8px",borderRadius:6,fontSize:12,fontWeight:700}}>{it.s==="03-Int"?"03":it.s==="04-Ext"?"04":it.s}</span></td>
                <td style={{padding:"8px",maxWidth:300,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontSize:14}} title={it.d}>{it.d}</td>
                <td style={{padding:"8px",textAlign:"right",fontFamily:mono,fontSize:13,whiteSpace:"nowrap"}}>{it.b>0?fmt(it.b):""}</td>
                {a.periods.map((l,pi)=>(<td key={pi} style={{padding:"8px",textAlign:"right",fontFamily:mono,fontSize:13,whiteSpace:"nowrap",color:(it.p[pi]||0)>0?PC[pi%PC.length]:(it.p[pi]||0)<0?"#38bdf8":C.brd}}>{it.p[pi]?fmt(it.p[pi]):"–"}</td>))}
                <td style={{padding:"8px",textAlign:"right",fontFamily:mono,fontSize:13,fontWeight:700,whiteSpace:"nowrap",color:cum2>0?"#34d399":cum2<0?"#f87171":C.brd}}>{cum2?fmt(cum2):"–"}</td>
                <td style={{padding:"8px",textAlign:"right",fontFamily:mono,fontSize:13,whiteSpace:"nowrap",color:rem>0?C.mut:rem<0?"#f87171":"#34d399"}}>{it.b>0?(rem!==0?fmt(rem):"✓"):""}</td>
                <td style={{padding:"8px",textAlign:"right",fontFamily:mono,fontSize:13,fontWeight:700,whiteSpace:"nowrap",color:pv>100?"#f87171":pv>=99?"#34d399":C.txt}}>{pvStr}{pvStr!=="–"?"%":""}</td>
                <td style={{padding:"8px",textAlign:"center"}}><Badge st={it.st}/></td>
                <td style={{padding:"8px 12px"}}>{it.b>0&&<div style={{background:"#1e293b",borderRadius:4,height:8,overflow:"hidden",width:"100%",minWidth:80}}><div style={{width:Math.min(100,pv)+"%",height:"100%",borderRadius:4,background:barColor,transition:"width .3s"}}/></div>}</td>
              </tr>);})}</tbody>
              <tfoot><tr style={{background:"#0d1224",borderTop:"2px solid "+C.acc+"44"}}>
                <td colSpan={2} style={{padding:"10px 8px",whiteSpace:"nowrap",fontWeight:700,fontSize:14}}>Součet (filtr)</td>
                <td style={{padding:"10px 8px",textAlign:"right",fontFamily:mono,fontSize:14,fontWeight:700,whiteSpace:"nowrap"}}>{fmt(fS.b)}</td>
                {a.periods.map((l,pi)=>(<td key={pi} style={{padding:"10px 8px",textAlign:"right",fontFamily:mono,fontSize:13,fontWeight:600,whiteSpace:"nowrap",color:PC[pi%PC.length]}}>{fmt(fS.pSums[pi])}</td>))}
                <td style={{padding:"10px 8px",textAlign:"right",fontFamily:mono,fontSize:14,fontWeight:700,whiteSpace:"nowrap",color:"#34d399"}}>{fmt(fS.cum)}</td>
                <td style={{padding:"10px 8px",textAlign:"right",fontFamily:mono,fontSize:13,fontWeight:600,whiteSpace:"nowrap",color:C.mut}}>{fS.b>0?fmt(fS.b-fS.cum):""}</td>
                <td style={{padding:"10px 8px",textAlign:"right",fontFamily:mono,fontSize:14,fontWeight:700,whiteSpace:"nowrap"}}>{fS.b>0?(fS.cum/fS.b*100).toFixed(0)+"%":"–"}</td>
                <td style={{padding:"10px 8px",textAlign:"center",fontSize:13,color:C.mut}}>{fS.n}</td>
                <td style={{padding:"10px 8px"}}>{fS.b>0&&<div style={{background:"#1e293b",borderRadius:4,height:8,overflow:"hidden",minWidth:80}}><div style={{width:Math.min(100,fS.cum/fS.b*100)+"%",height:"100%",borderRadius:4,background:fS.cum/fS.b>1?"#f87171":"#60a5fa"}}/></div>}</td>
              </tr></tfoot>
            </table>
          </div>
          {(fSt==="viceprace"||fSt==="meneprace"||fSt==="partial")&&fS.b>0&&(()=>{const diff=fS.cum-fS.b;const pctDiff=((fS.cum/fS.b-1)*100).toFixed(1);const isOver=diff>0;return <div style={{marginTop:12,padding:"12px 18px",background:C.card,borderRadius:10,border:"1px solid "+C.brd,fontSize:15,display:"flex",alignItems:"center",gap:10}}><span style={{fontWeight:700,fontSize:18,color:isOver?"#f87171":"#38bdf8"}}>{isOver?"▲":"▼"}</span><span>Rozdíl oproti rozpočtu: <b style={{color:isOver?"#f87171":"#38bdf8",fontFamily:mono,whiteSpace:"nowrap"}}>{isOver?"+":""}{fmt(diff)} Kč ({isOver?"+":""}{pctDiff}%)</b> {isOver?"nad rozpočet":"pod rozpočet"}</span></div>})()}
          <div style={{marginTop:14,padding:"12px 16px",background:"#0e1225",borderRadius:10,border:"1px solid "+C.brd,fontSize:12,color:C.mut,lineHeight:1.6}}>
            <b style={{color:"#f59e0b"}}>Poznámka:</b> Mimo rozpočet PAS11/2024 evidován doplatek za bourací práce garáže — <b style={{color:C.txt}}>101 300 Kč</b>. Hlavní KPI vychází z Rekapitulace a faktur Wobau (autoritativní fakturované hodnoty).{(()=>{const ld=Math.round(items.reduce((s,it)=>s+(it.p[NP-1]||0),0));const la=a.totP[NP-1];const g=ld-la;return g>0?<> V posledním období ({a.periods[NP-1]}) detail obsahuje navíc <b style={{color:C.txt}}>{fmt(g)} Kč</b> dosud nefakturovaných víceprací — fakturováno <b style={{color:C.txt}}>{fmt(la)} Kč</b>, evidováno v detailu <b style={{color:C.txt}}>{fmt(ld)} Kč</b>.</>:null;})()} Rozpočet seskupených položek = K (práce) + M (materiál).
          </div>
        </div>)}

        {tab==="chat"&&(<div style={{background:C.card,borderRadius:12,border:"1px solid "+C.brd,display:"flex",flexDirection:"column",height:520}}>
          <div style={{padding:"14px 20px",borderBottom:"1px solid "+C.brd,fontSize:16,fontWeight:600}}>💬 Dotazy k prostavěnosti <span style={{fontSize:13,color:C.mut,fontWeight:400,marginLeft:6}}>Claude Sonnet</span></div>
          <div style={{flex:1,overflowY:"auto",padding:20,display:"flex",flexDirection:"column",gap:10}}>
            {msgs.length===0&&(<div style={{color:C.mut,fontSize:15,textAlign:"center",marginTop:30}}><div style={{fontSize:32,marginBottom:8}}>🔍</div><div style={{fontWeight:600,marginBottom:12}}>Zeptejte se na cokoliv</div><div style={{display:"flex",flexDirection:"column",gap:6}}>{["Které položky mají vícepráce?","Co se prostavělo v posledním období?","Kolik zbývá v exteriéru?","Shrň stav stavby"].map((ex,i)=>(<button key={i} onClick={()=>setChatIn(ex)} style={{padding:"8px 14px",borderRadius:8,border:"1px solid "+C.brd,background:"transparent",color:C.acc,cursor:"pointer",fontSize:14,textAlign:"left"}}>{ex}</button>))}</div></div>)}
            {msgs.map((m,i)=>(<div key={i} style={{alignSelf:m.r==="u"?"flex-end":"flex-start",maxWidth:"80%",padding:"10px 16px",borderRadius:12,background:m.r==="u"?C.acc+"20":"#ffffff06",border:"1px solid "+(m.r==="u"?C.acc+"40":C.brd),fontSize:15,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{m.t}</div>))}
            {chatLoad&&(<div style={{alignSelf:"flex-start",padding:"10px 16px",borderRadius:12,background:"#ffffff06",border:"1px solid "+C.brd,fontSize:15,opacity:.5}}>Analyzuji...</div>)}
            <div ref={chatEnd}/>
          </div>
          <div style={{padding:12,borderTop:"1px solid "+C.brd,display:"flex",gap:8}}>
            <input type="text" placeholder="Dotaz k rozpočtu..." value={chatIn} onChange={e=>setChatIn(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendChat()} style={{flex:1,padding:"12px 16px",borderRadius:10,border:"1px solid "+C.brd,background:C.bg,color:C.txt,fontSize:15,outline:"none"}}/>
            <button onClick={sendChat} disabled={chatLoad||!chatIn.trim()} style={{padding:"12px 24px",borderRadius:10,background:C.acc,color:"#fff",border:"none",cursor:"pointer",fontWeight:600,fontSize:15,opacity:chatLoad||!chatIn.trim()?.4:1}}>Odeslat</button>
          </div>
        </div>)}

        {tab==="diff"&&(<div style={{background:C.card,borderRadius:12,border:"1px solid "+C.brd,padding:24}}><div style={{fontSize:20,fontWeight:700,marginBottom:16}}>🔄 Změny oproti předchozí verzi</div>{!diffData||diffData.length===0?(<div style={{color:C.mut,fontSize:16,textAlign:"center",padding:48}}>✅ Žádné změny. Nahrajte nový xlsx.</div>):(<div><div style={{fontSize:15,color:C.mut,marginBottom:14}}>{diffData.filter(d=>d.type==="changed").length} změněných · {diffData.filter(d=>d.type==="new").length} nových · {diffData.filter(d=>d.type==="removed").length} odebraných</div><div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:14}}><thead><tr style={{background:"#0a0f1d"}}>{["Typ","Obj.","Popis","Před","Po","Rozdíl"].map((h,i)=>(<th key={i} style={{padding:"10px",textAlign:i>=3?"right":"left",borderBottom:"1px solid "+C.brd,color:C.mut,fontSize:13}}>{h}</th>))}</tr></thead><tbody>{diffData.map((d,i)=>{const isN=d.type==="new",isR=d.type==="removed";const oc=d.old?icum(d.old):0;const nc=icum(d.item);return(<tr key={i} style={{borderBottom:"1px solid "+C.brd,background:isN?"#065f4610":isR?"#7f1d1d10":"transparent"}}><td style={{padding:"8px"}}><span style={{fontSize:13,fontWeight:700,color:isN?"#34d399":isR?"#f87171":"#fbbf24"}}>{isN?"NOVÁ":isR?"ODEBR.":"ZMĚNA"}</span></td><td style={{padding:"8px"}}><span style={{background:(OC[d.item.s]||"#666")+"22",color:OC[d.item.s],padding:"3px 8px",borderRadius:6,fontSize:12,fontWeight:700}}>{d.item.s}</span></td><td style={{padding:"8px",maxWidth:300,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.item.d}</td><td style={{padding:"8px",textAlign:"right",fontFamily:mono,fontSize:14,whiteSpace:"nowrap"}}>{isN?"–":fmt(oc)}</td><td style={{padding:"8px",textAlign:"right",fontFamily:mono,fontSize:14,whiteSpace:"nowrap"}}>{isR?"–":fmt(nc)}</td><td style={{padding:"8px",textAlign:"right",fontFamily:mono,fontSize:14,fontWeight:700,whiteSpace:"nowrap",color:d.diffCum>0?"#34d399":d.diffCum<0?"#f87171":C.mut}}>{d.diffCum>0?"+":""}{fmt(d.diffCum)} Kč</td></tr>);})}</tbody></table></div><div style={{marginTop:14,padding:"12px 18px",background:C.brd+"40",borderRadius:10,fontSize:15}}>Čistý dopad: <b style={{color:_.sumBy(diffData,"diffCum")>=0?"#34d399":"#f87171",fontFamily:mono,whiteSpace:"nowrap"}}>{_.sumBy(diffData,"diffCum")>=0?"+":""}{fmt(_.sumBy(diffData,"diffCum"))} Kč</b></div></div>)}</div>)}

        {tab==="ver"&&(<div style={{background:C.card,borderRadius:12,border:"1px solid "+C.brd,padding:24}}><div style={{fontSize:20,fontWeight:700,marginBottom:16}}>📦 Historie verzí</div>{versions.length===0?(<div style={{color:C.mut,fontSize:16,textAlign:"center",padding:48}}>Žádné verze. Po uploadu se uloží automaticky.</div>):(<div style={{display:"flex",flexDirection:"column",gap:8}}>{versions.map((key,i)=>{const ts=parseInt(key.replace("ver2:",""));const ds=isNaN(ts)?key:new Date(ts).toLocaleString("cs-CZ");const meta=LS.load(key);return(<div key={key} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 18px",background:i===0?C.acc+"10":"transparent",borderRadius:10,border:"1px solid "+C.brd}}><div><span style={{fontWeight:600,fontSize:15}}>{ds}</span>{meta&&meta.name&&<span style={{marginLeft:10,fontSize:13,color:C.mut}}>{String(meta.name).slice(0,40)}</span>}{i===0&&<span style={{marginLeft:10,fontSize:12,color:C.acc,fontWeight:700}}>POSLEDNÍ</span>}</div><div style={{display:"flex",gap:8}}><button onClick={()=>{const d=LS.load(key);if(d&&d.items){setDiffData(calcDiff(d.items.filter(x=>x.p&&x.p.some(v=>v)),items.filter(x=>x.p.some(v=>v))));setTab("diff");}}} style={{padding:"6px 14px",borderRadius:8,border:"1px solid "+C.brd,background:"transparent",color:C.acc,cursor:"pointer",fontSize:14,fontWeight:600}}>🔄 Porovnat</button><button onClick={()=>{LS.del(key);setVersions(LS.list("ver2:"));show("Smazáno.");}} style={{padding:"6px 12px",borderRadius:8,border:"1px solid "+C.brd,background:"transparent",color:"#f87171",cursor:"pointer",fontSize:14}}>🗑️</button></div></div>);})}</div>)}</div>)}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
